# CI 门禁：本地与云上跑同一套命令（全部经 mise 任务，工具链钉版一致）。
#   lint        golangci-lint + gofmt 漂移（根 + contrib/bunx）
#   test        全模块单测 + 真实 Postgres 门控测试（LYNXSTART_TEST_PG_DSN，
#               归 contrib/bunx/testutil——名字不变，ADR-0009 D10）
#   vuln        govulncheck（对齐 grpcapi 生态基线；不含 gosec，随安全线推进）
# 模块分发侧（proto-drift / e2e 组合矩阵）随 registry 迁至 lynx-go/lynx-mods。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LYNXSTART_TEST_PG_DSN: postgres://ci:ci@127.0.0.1:5432/ci?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: mise run test

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: govulncheck（根 + contrib）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          (cd contrib/bunx && govulncheck ./...)
