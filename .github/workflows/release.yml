# 发布：推根 tag（v*，根 module）或 contrib 子模块 tag（contrib/*/v*）自动建
# GitHub Release，notes 从根 CHANGELOG.md 摘取对应小节。小节缺失时兜底占位
# 文案，不阻塞发布。发版纪律（ADR-0009 D15）：根与 contrib 独立 tag 独立节奏。
name: release

on:
  push:
    tags:
      - "v*"
      - "contrib/*/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog notes
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*)        section="$tag" ;;
            contrib/*) section="${tag#contrib/}" ;;
            *)         section="$tag" ;;
          esac
          awk -v s="## ${section}" 'index($0,s)==1 {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "(no changelog section found for ${section} — see CHANGELOG.md)" > notes.md
          fi
          echo "--- notes for ${section} ---"
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
